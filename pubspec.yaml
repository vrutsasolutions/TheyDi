name: theydi
description: TheyDi — Location-Based Social Gathering Marketplace
publish_to: 'none'
version: 1.0.0+4
 
environment:
  sdk: '>=3.5.0 <4.0.0'
 
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2-dev.2
  riverpod_annotation: ^4.0.3-dev.2
  go_router: ^17.3.0
  dio: ^5.4.3
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  firebase_core: ^4.10.0
  firebase_auth: ^6.5.2
  cloud_firestore: ^6.5.0
  google_sign_in: ^7.2.0
  firebase_messaging: ^16.3.0
  firebase_storage: ^13.4.2
  flutter_secure_storage: ^10.3.1
  
  shared_preferences: ^2.2.3
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  google_fonts: ^8.1.0
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.0
  shimmer: ^3.0.0
  flutter_map: ^8.3.0
  latlong2: ^0.9.0
  image_picker: ^1.1.2
  file_picker: ^8.1.3
  flutter_animate: ^4.5.0
  
  intl: ^0.20.2
  url_launcher: ^6.3.0
  permission_handler: ^12.0.3
  record: ^6.0.0
  web: ^1.1.0


  audioplayers: ^6.1.0
  video_player: ^2.9.2
  
  

  flutter_dotenv: ^5.1.0
  camera: ^0.10.5+9

  http: ^1.2.0
  path_provider: ^2.1.3         # for API calls
  mime: ^2.0.0    
  google_maps_flutter: ^2.17.1
  
  razorpay_web: ^3.1.3
  cloud_functions: ^6.3.3

  flutter_windowmanager_plus: ^1.0.1
  flutter_local_notifications: ^22.2.0
  
  

  



  


dependency_overrides:


 
 
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.11
  freezed: ^3.2.6-dev.1
  json_serializable: ^6.8.0
  riverpod_generator: ^4.0.4-dev.3
  flutter_launcher_icons: ^0.14.2
  flutter_native_splash: ^2.4.3
 
flutter:
  uses-material-design: true

  assets:
    - .env
    - app_config.env
    - assets/city_icons/
    - assets/images/
    - assets/images/theydi_logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/theydi_logo.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/images/theydi_logo.png"
  android: true
  ios: true 